name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  tag:
    # A main push owns version selection, while the dependent release job publishes the resulting immutable tag in this run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_TAG=$(git tag --points-at HEAD 2>/dev/null | head -1)
          if [ -n "$CURRENT_TAG" ]; then
            echo "HEAD already tagged $CURRENT_TAG, skipping bump"
            echo "release_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump level from conventional commits since last tag
          # 0=patch (fix, chore, docs, etc.), 1=minor (feat), 2=major (BREAKING CHANGE or !)
          BUMP=0
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s")
          else
            COMMITS=$(git log --format="%s")
          fi

          while IFS= read -r msg; do
            case "$msg" in
              *BREAKING\ CHANGE*|*BREAKING-CHANGE*|*!\:*)
                BUMP=2
                break
                ;;
              feat\(*\):*|feat:*)
                [ "$BUMP" -lt 1 ] && BUMP=1
                ;;
            esac
          done <<< "$COMMITS"

          MAJOR=$(echo "${LATEST_TAG#v}" | cut -d. -f1)
          MINOR=$(echo "${LATEST_TAG#v}" | cut -d. -f2)
          PATCH=$(echo "${LATEST_TAG#v}" | cut -d. -f3)

          case $BUMP in
            2) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            1) MINOR=$((MINOR + 1)); PATCH=0 ;;
            0) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump: $BUMP (0=patch, 1=minor, 2=major) | $LATEST_TAG → $NEW_TAG"
          echo "release_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  goreleaser:
    needs: tag
    # Main runs publish their newly created tag directly because GITHUB_TOKEN tag pushes intentionally do not start another workflow.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && needs.tag.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # External tag events use their ref; main runs use the tag emitted by the version job.
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.tag.outputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Version-file resolution selects the toolchain directive before cache restoration can trigger an auto-download.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: '~> v2'
          args: release --clean
        env:
          # Workflow-scoped contents and packages permissions cover this repository's releases and images without a separate PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
