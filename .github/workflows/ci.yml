name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Native Windows must keep portable interpreter behavior and reject execution without OS confinement.
  windowsWorkerContract:
    # Fork PRs cannot receive the private dependency's deploy key; validate them on a trusted branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate shared OAuth core
        uses: ./.github/actions/setup-private-core
        with:
          deploy-key: ${{ secrets.FUSED_OPEN_CORE_DEPLOY_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The sandbox package embeds generated MCP files, so the Windows Go test needs them first.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: runtime/mcp/package-lock.json
      - name: Build embedded MCP runtime
        working-directory: runtime/mcp
        run: |
          npm ci
          npm run build
      - name: Test interpreter and unsupported-platform boundary
        run: go test ./internal/engine/executionappvm ./internal/engine/sandbox -run 'TestUnsupportedWorker|TestCapabilityUnsupported|TestLoadedWorker|TestPrivateException|TestDiagnostic|TestExecutionPhases' -count=1 -timeout=90s

  buildImages:
    # Fork PRs cannot receive the private dependency's deploy key; validate them on a trusted branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate shared OAuth core
        uses: ./.github/actions/setup-private-core
        with:
          deploy-key: ${{ secrets.FUSED_OPEN_CORE_DEPLOY_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Version-file resolution selects the toolchain directive before cache restoration can trigger an auto-download.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare embedded UI
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            runtime/mcp/package-lock.json
            runtime/execution/package-lock.json

      - name: Test MCP runtime
        run: |
          cd runtime/mcp
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build Unified App compiler
        run: |
          cd runtime/execution
          npm ci
          npm test

      - name: Boundary guards
        run: |
          set -euo pipefail
          ! rg -n '"github.com/fused/integration-registry|"github.com/Usefused/engine/internal/registry|"github.com/Usefused/engine/cmd/registry' --glob '*.go'
          ! rg -n 'func InitRegistryPostgres|func initRegistrySchema|func registrySchemaQueries' internal/shared/db

      - name: Build headless
        run: |
          go build -tags headless -o /tmp/fused-engine-headless ./cmd/engine
          # Build the separate sandbox executable before exercising either image variant.
          CGO_ENABLED=0 go build -tags headless -o /tmp/fused-execution-worker ./cmd/execution-worker

      # Namespace authority is decided in the spawning test process; scope Ubuntu's exception to CI tests and their worker.
      - name: Configure CI worker AppArmor profile
        run: |
          set -euo pipefail
          mkdir -p /tmp/fused-ci-go-tests
          sudo tee /etc/apparmor.d/fused-ci-execution-worker >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile fused-ci-execution-worker /tmp/fused-execution-worker flags=(unconfined) {
            userns,
          }
          profile fused-ci-go-tests /tmp/fused-ci-go-tests/go-build*/b*/*.test flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/fused-ci-execution-worker

      - name: Test headless
        env:
          GOTMPDIR: /tmp/fused-ci-go-tests
          FUSED_EXECUTION_WORKER_TEST_BINARY: /tmp/fused-execution-worker
        run: go test -tags headless ./...


      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build embedded
        run: |
          rm -rf ui-build
          cp -R ui/build/client ui-build
          go build -o /tmp/fused-engine ./cmd/engine

      # Cover every Engine release platform in CI; host-only tests cannot catch Unix APIs leaking into Windows.
      - name: Cross-compile release targets
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target_os in linux darwin windows; do
            for target_arch in amd64 arm64; do
              GOOS="$target_os" GOARCH="$target_arch" go build -o /tmp/fused-release-check ./cmd/engine
              GOOS="$target_os" GOARCH="$target_arch" go build -tags headless -o /tmp/fused-release-check ./cmd/engine
            done
          done

      - name: Test embedded
        env:
          GOTMPDIR: /tmp/fused-ci-go-tests
          FUSED_EXECUTION_WORKER_TEST_BINARY: /tmp/fused-execution-worker
        run: go test ./...

      - name: Build Docker images
        run: |
          docker build --secret "id=fused_open_core_key,src=$FUSED_OPEN_CORE_KEY_FILE" --target full -t fused-engine:test .
          docker build --secret "id=fused_open_core_key,src=$FUSED_OPEN_CORE_KEY_FILE" --target headless -t fused-engine:test-headless .
          # The final images must carry the compiler and its native esbuild dependency.
          docker run --rm --entrypoint node fused-engine:test -e "require('node:fs').accessSync('/app/runtime/execution/dist/src/cli.js'); require('/app/runtime/execution/node_modules/esbuild').version"
          docker run --rm --entrypoint node fused-engine:test-headless -e "require('node:fs').accessSync('/app/runtime/execution/dist/src/cli.js'); require('/app/runtime/execution/node_modules/esbuild').version"

      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@v5
        with:
          version: '~> v2'
          args: check
