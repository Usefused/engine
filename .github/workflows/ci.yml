name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  buildImages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Version-file resolution selects the toolchain directive before cache restoration can trigger an auto-download.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare embedded UI
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            runtime/mcp/package-lock.json
            runtime/execution/package-lock.json

      - name: Test MCP runtime
        run: |
          cd runtime/mcp
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build Execution App compiler
        run: |
          cd runtime/execution
          npm ci
          npm test

      - name: Boundary guards
        run: |
          set -euo pipefail
          ! rg -n '"github.com/fused/integration-registry|"github.com/Usefused/engine/internal/registry|"github.com/Usefused/engine/cmd/registry' --glob '*.go'
          ! rg -n 'func InitRegistryPostgres|func initRegistrySchema|func registrySchemaQueries' internal/shared/db

      - name: Build headless
        run: |
          go build -tags headless -o /tmp/fused-engine-headless ./cmd/engine
          # Build the separate sandbox executable before exercising either image variant.
          CGO_ENABLED=0 go build -tags headless -o /tmp/fused-execution-worker ./cmd/execution-worker

      - name: Test headless
        env:
          FUSED_EXECUTION_WORKER_TEST_BINARY: /tmp/fused-execution-worker
        run: go test -tags headless ./...


      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build embedded
        run: |
          rm -rf ui-build
          cp -R ui/build/client ui-build
          go build -o /tmp/fused-engine ./cmd/engine

      - name: Test embedded
        env:
          FUSED_EXECUTION_WORKER_TEST_BINARY: /tmp/fused-execution-worker
        run: go test ./...

      - name: Build Docker images
        run: |
          docker build --target full -t fused-engine:test .
          docker build --target headless -t fused-engine:test-headless .
          # The final images must carry the compiler and its native esbuild dependency.
          docker run --rm --entrypoint node fused-engine:test -e "require('node:fs').accessSync('/app/runtime/execution/dist/src/cli.js'); require('/app/runtime/execution/node_modules/esbuild').version"
          docker run --rm --entrypoint node fused-engine:test-headless -e "require('node:fs').accessSync('/app/runtime/execution/dist/src/cli.js'); require('/app/runtime/execution/node_modules/esbuild').version"

      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@v5
        with:
          version: '~> v2'
          args: check
