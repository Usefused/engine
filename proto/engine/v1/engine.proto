syntax = "proto3";

package engine.v1;

option go_package = "github.com/Usefused/engine/internal/engine/grpc/v1;enginev1";

service EngineService {
  // Connect performs the SDK handshake: it authenticates the exact app_id and loads
  // the SDK's scope manifest + every referenced Fused object into the Engine's
  // connection-scoped, refcounted cache (AD-7). It must be called once after the
  // SDK opens its long-lived channel and before any Execute call.
  rpc Connect(ConnectRequest) returns (ConnectResponse);

  // Disconnect releases the SDK's cache references. It must be called when the
  // SDK closes its channel so refcounts decrement and objects can be evicted.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);

  // Execute an integration endpoint through the Engine.
  // The response is streamed to support server-sent events (SSE) and pagination automatically.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);

  // StartConnectSession creates an Engine-owned OAuth/OIDC browser session and
  // returns only the provider authorization URL. Client credentials, PKCE
  // verifier, and future token material stay inside the Engine.
  rpc StartConnectSession(StartConnectSessionRequest) returns (StartConnectSessionResponse);

  // GetConnection reads non-sensitive connection metadata after the browser
  // callback redirects with a connection_id. Provider tokens are never returned.
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);

  // ListConnectionResources returns non-sensitive tenant routing metadata for
  // an opaque connection owned by one of the authenticated SDK's buckets.
  rpc ListConnectionResources(ListConnectionResourcesRequest) returns (ListConnectionResourcesResponse);

  // SubscribeWebhooks opens a durable, receiver-scoped inbound event stream
  // over the same channel used for Execute. Auth (x-api-key + x-app-id)
  // travels as call metadata, same as every other RPC on this service, not
  // as fields on the first message. The client sends exactly one
  // WebhookSubscribe message first (receiver name + subscribed event types),
  // then zero or more WebhookAck/WebhookNack messages as it processes pushed
  // events. The server pushes WebhookEvent messages for any event matching
  // an active subscription and redelivers un-acked events with backoff --
  // this is a transport change only: durability/retry/queue-group fan-out is
  // unchanged, owned by the Engine's NATS JetStream durable consumer keyed
  // on receiver_name and bridged to the stream by the gRPC handler.
  rpc SubscribeWebhooks(stream WebhookClientMessage) returns (stream WebhookServerMessage);
}

message ConnectRequest {
  string app_id = 1;
  string token = 2;
}

message ConnectResponse {}

message DisconnectRequest {
  string app_id = 1;
}

message DisconnectResponse {}

message ExecuteRequest {
  string app_id = 1;
  string token = 2;
  string endpoint_name = 3;
  bytes params = 4; // JSON-encoded parameters
  // credentials is the per-request passthrough auth material forwarded from the
  // SDK config to the Engine and used in-flight only (never persisted). Keys
  // match what applyAuth expects: "Authorization", "username"/"password", or the
  // apiKey key name for the provider.
  map<string, string> credentials = 5;
  // environment is the provider-specific runtime environment name selected for
  // this request, such as "sandbox" or "eu". It is never a URL.
  string environment = 6;
  // idempotency_key is generated by the SDK once per logical request so
  // Engine/provider retries share a cap without hidden SDK-side replay.
  string idempotency_key = 7;
  // request_body_hash is the SHA-256 hex digest of the exact JSON params bytes
  // sent by the SDK for this Execute call.
  string request_body_hash = 8;

  // Retry is part of the immutable service contract and is executed only by
  // Engine, so callers cannot override it per request.
  reserved 9;
  reserved "retry_override";
}

message ExecuteResponse {
  bytes result = 1; // JSON-encoded response chunk or full response
  string error = 2; // Optional error message
  int32 status_code = 3; // Provider HTTP status, sent once after response chunks
}

message StartConnectSessionRequest {
  string bucket_id = 1;
  string service_id = 2;
  string end_user_ref = 3;
  string return_url = 4;
  string created_by_app_id = 5;
  // resource_input carries only fields declared by x-fused-connect; Engine
  // validates and binds them to callback state before provider redirect.
  map<string, string> resource_input = 6;
  // scopes narrows provider consent to service-declared OAuth/OIDC scopes.
  repeated string scopes = 7;
}

message StartConnectSessionResponse {
  string authorize_url = 1;
  string expires_at = 2;
}

message GetConnectionRequest {
  string connection_id = 1;
}

message GetConnectionResponse {
  AuthConnection connection = 1;
  bool found = 2;
}

message AuthConnection {
  string id = 1;
  string bucket_id = 2;
  string service_id = 3;
  string end_user_ref = 4;
  string created_by_app_id = 5;
  string auth_type = 6;
  string token_type = 7;
  repeated string scopes = 8;
  string scope_source = 9;
  string issuer = 10;
  string subject = 11;
  string expires_at = 12;
  string refresh_token_expires_at = 13;
  string last_used_at = 14;
  string refresh_state = 15;
  string created_at = 16;
  string updated_at = 17;
}

message ListConnectionResourcesRequest {
  string connection_id = 1;
}

message ListConnectionResourcesResponse {
  repeated ConnectionResource resources = 1;
}

message ConnectionResource {
  string id = 1;
  string connection_id = 2;
  string service_id = 3;
  string resource_type = 4;
  string display_name = 5;
  repeated string scopes = 6;
  bool is_default = 7;
  string created_at = 8;
  string updated_at = 9;
}

message WebhookClientMessage {
  oneof payload {
    WebhookSubscribe subscribe = 1;
    WebhookAck ack = 2;
    WebhookNack nack = 3;
  }
}

message WebhookSubscribe {
  // receiver_name is the durable NATS consumer/queue-group identity
  // (accountID + "-" + receiver_name server-side) -- intentionally
  // independent of app_id/the Connect session, so the same named
  // receiver can resume across reconnects and multiple processes can share
  // one receiver_name for queue-group fan-out. Auth (app_id + token)
  // is carried as x-api-key/x-app-id call metadata instead of fields
  // here, matching every other RPC on this service.
  string receiver_name = 1;
  repeated string events = 2;
}

message WebhookAck {
  string event_id = 1;
}

message WebhookNack {
  string event_id = 1;
  string reason = 2; // optional, for observability
}

message WebhookServerMessage {
  oneof payload {
    WebhookSubscribeAck subscribed = 1; // confirms the subscription took effect
    WebhookEvent event = 2;
  }
}

message WebhookSubscribeAck {
  string receiver_name = 1;
}

message WebhookEvent {
  string id = 1;
  string event = 2;
  bytes payload = 3; // JSON-encoded {body, headers, query, params, path}
}
