apiVersion: fused/v1
kind: sdk
name: greeting-unified-sdk-smoke
version: "1.0.0"
language: typescript
generate: true
bucket: default
services:
  fused-greeting-sdk-smoke:
    version: "1.0.0"
    operations: [greet]
unified_operations:
  greetings.pair:
    description: Use one greeting to request a second greeting.
    input:
      type: object
      required: [name]
      properties:
        name: {type: string}
    bindings:
      first:
        service: fused-greeting-sdk-smoke
        operation: greet
        input: {name: "${input.name}"}
      second:
        service: fused-greeting-sdk-smoke
        operation: greet
        depends_on: [first]
        input: {name: "${response.first.greeting}"}
    output:
      type: object
      required: [first, second]
      properties:
        first: {type: string, value: "${response.first.greeting}"}
        second: {type: string, value: "${response.second.greeting}"}
