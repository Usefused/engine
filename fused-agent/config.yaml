apiVersion: harnest.dev/v1alpha1
kind: Agent
metadata:
  name: fused-agent
  displayName: Fused Agent
  labels:
    owner: fused
spec:
  enabled: true
  entrypoint: agent:root_agent
  framework:
    name: adk
    mode: managed
  runtime:
    version: "3.12"
    dependencyFile: pyproject.toml
  resources:
    cpu: "1"
    memory: 1Gi
    ephemeralStorage: 1Gi
    timeoutSeconds: 300
    maxConcurrentRequests: 8
  scaling:
    minReplicas: 0
    maxReplicas: 1
  environment:
    # Connection settings are inherited from the process environment. Harnest
    # 0.20 serve applies literal values here over exported startup settings.
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: NO_CONTENT
    ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: "false"
server:
  live: false
  http:
    port: 8090
    maxConcurrentRequests: 8
